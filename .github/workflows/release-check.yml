name: Release Check

# Pre-merge guard and preview for label-driven releases. Validates the PR's
# release labels (`<system>:<patch|minor|major>`) with the same plan logic the
# Release workflow runs after merge, and writes "merging will publish X" to the
# job summary. Re-runs when labels change, so the preview is always current.
#
# Fails the PR if:
#   - a label names an unknown system, or a system has more than one label
#   - a labeled system has never been published (use Release Bootstrap first)
#   - a package.json version was edited (versions are computed by CI)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate release plan
        env:
          RELEASE_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: node scripts/release-plan.mjs --check
