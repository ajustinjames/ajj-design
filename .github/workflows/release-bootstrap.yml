name: Release Bootstrap

# First release of a brand-new design system (e.g. one scaffolded with
# scripts/create-system.sh).
#
# npm OIDC trusted publishing (used by release.yml) cannot create a package
# that doesn't exist yet, so a system's first publish needs a token. This
# workflow publishes both packages with the NPM_TOKEN secret of the
# `npm-bootstrap` environment, then creates the tag + GitHub release.
#
# After it succeeds, run once locally (needs interactive npm 2FA):
#   pnpm release:trust <system>
# From then on, release the system with PR labels through release.yml.
#
# Safe to re-run: packages already on npm at the requested version are skipped,
# so a run that published only one package can just be run again.
#
# NOTE: npm is removing direct publishing with 2FA-bypass granular tokens
# (announced for January 2027). Once that happens, do the first publish locally
# instead, with `npm login` on a checkout of origin/main:
#   node scripts/release-publish.mjs --system <system> --version 0.1.0 --bootstrap

on:
  workflow_dispatch:
    inputs:
      system:
        description: New design system to publish for the first time (e.g. glassline)
        required: true
        type: string
      version:
        description: First version to publish
        required: true
        default: '0.1.0'
        type: string

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Holds the NPM_TOKEN secret, so the token is only exposed to this job.
    # Add required reviewers to the environment for an approval gate.
    environment: npm-bootstrap
    permissions:
      contents: write # tag + GitHub release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Require NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set on the npm-bootstrap environment. Create an npm granular access token with read/write access to the @ajustinjames scope and add it there."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish first release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYSTEM: ${{ inputs.system }}
          VERSION: ${{ inputs.version }}
        run: node scripts/release-publish.mjs --system "$SYSTEM" --version "$VERSION" --bootstrap

      - name: Next step
        env:
          SYSTEM: ${{ inputs.system }}
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "### ${SYSTEM} ${VERSION} published 🎉"
            echo ""
            echo "**One more step (once, locally):** register release.yml as the npm trusted publisher so future releases work via labels:"
            echo ""
            echo '```sh'
            echo "npm login        # if needed; npm trust requires interactive 2FA"
            echo "pnpm release:trust ${SYSTEM}"
            echo '```'
            echo ""
            echo "Then release with the \`${SYSTEM}:patch|minor|major\` PR labels."
          } >> "$GITHUB_STEP_SUMMARY"
