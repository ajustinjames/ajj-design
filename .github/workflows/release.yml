name: Release

# Label-driven releases. On every push to main, reads the merged PR's labels
# and the files it changed, then releases each affected design system with
# npm OIDC trusted publishing (no npm token anywhere in CI):
#
#   patch | minor | major  bump every already-published system the PR changed
#   skip-release           publish nothing, regardless of other labels
#
# Only changes to files that ship in the npm package count (not tests, stories
# or test configs). Versions come from npm + label; the real version is stamped
# into the manifests inside this run only, and nothing is committed to main.
#
# Manual runs (Actions → Release → Run workflow) take an explicit system and
# bump: patch/minor/major, or resume to finish a release that published only
# one of a system's two packages.
#
# A brand-new system is NOT released here: OIDC trusted publishing cannot
# create packages that don't exist yet. Its first release is published locally
# with `pnpm release:launch <system>`, which also registers this workflow as
# the package's trusted publisher. Until then this workflow skips it.
#
# npm's trusted publisher config is bound to this file name (release.yml).
# Renaming it breaks publishing until every package's trusted publisher is updated.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      system:
        description: Design system to release (e.g. hardline, glassline)
        required: true
        type: string
      bump:
        description: patch/minor/major over npm, or resume to finish a partial release
        required: true
        type: choice
        options: [patch, minor, major, resume]

# Never interrupt an in-flight publish; queue instead.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # read the merged PR's labels
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      has_publish: ${{ steps.plan.outputs.has_publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # HEAD^1..HEAD = the squash-merged PR's changes

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Read release labels from the merged PR
        id: labels
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          labels=$(gh api "repos/${REPO}/commits/${SHA}/pulls" \
            | jq -c '[.[] | select(.merged_at != null and .base.ref == "main")][0] | if . == null then [] else [.labels[].name] end')
          echo "Merged PR labels: ${labels}"
          echo "labels=${labels}" >> "$GITHUB_OUTPUT"

      - name: Skip (skip-release label)
        if: github.event_name == 'push' && contains(steps.labels.outputs.labels, '"skip-release"')
        run: echo "### Release: skipped (\`skip-release\` label on the merged PR)." >> "$GITHUB_STEP_SUMMARY"

      - name: Compute release plan
        id: plan
        if: github.event_name != 'push' || !contains(steps.labels.outputs.labels, '"skip-release"')
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_LABELS: ${{ steps.labels.outputs.labels }}
          INPUT_SYSTEM: ${{ inputs.system }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            node scripts/release-plan.mjs --system "$INPUT_SYSTEM" --bump "$INPUT_BUMP"
          else
            node scripts/release-plan.mjs
          fi

  publish:
    needs: plan
    if: needs.plan.outputs.has_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag + GitHub release
      id-token: write # npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for release-note ranges

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$PLAN" | jq -c '.[] | select(.action == "publish")' | while read -r entry; do
            node scripts/release-publish.mjs \
              --system "$(echo "$entry" | jq -r '.system')" \
              --version "$(echo "$entry" | jq -r '.version')"
          done

