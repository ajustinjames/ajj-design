name: Release

on:
  push:
    branches: [main]

# Never interrupt an in-flight publish; let pushes queue instead.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute release plan
        id: plan
        run: node scripts/release-plan.mjs

      - name: Publish releases
        if: steps.plan.outputs.has_publish == 'true'
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .release-tarballs

          echo "$PLAN" | jq -c '.[] | select(.action == "publish")' | while read -r entry; do
            SYSTEM=$(echo "$entry" | jq -r '.system')
            VERSION=$(echo "$entry" | jq -r '.version')
            TAG="${SYSTEM}-v${VERSION}"

            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "::error::Tag ${TAG} already exists"
              exit 1
            fi

            echo "Releasing ${SYSTEM} v${VERSION}"

            pnpm --filter "@ajustinjames/${SYSTEM}-tokens" build
            pnpm --filter "@ajustinjames/${SYSTEM}-components" build

            pnpm --dir "packages/${SYSTEM}-tokens" pack --pack-destination "$GITHUB_WORKSPACE/.release-tarballs"
            pnpm --dir "packages/${SYSTEM}-components" pack --pack-destination "$GITHUB_WORKSPACE/.release-tarballs"

            TOKENS_TGZ=".release-tarballs/ajustinjames-${SYSTEM}-tokens-${VERSION}.tgz"
            COMPONENTS_TGZ=".release-tarballs/ajustinjames-${SYSTEM}-components-${VERSION}.tgz"

            node scripts/verify-publish-metadata.mjs "$TOKENS_TGZ" "$COMPONENTS_TGZ"

            npm publish "$TOKENS_TGZ" --access public
            npm publish "$COMPONENTS_TGZ" --access public

            git tag "$TAG"
            git push origin "refs/tags/${TAG}"

            gh release create "$TAG" --title "${SYSTEM} v${VERSION}" --generate-notes
          done
