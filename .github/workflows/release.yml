name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse release label
        id: label
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          mapfile -t LABELS < <(printf '%s\n' "$LABELS_JSON" | jq -r '.[] | select(test("^[a-z][a-z0-9-]*:(patch|minor|major)$"))')

          if [ "${#LABELS[@]}" -eq 0 ]; then
            echo "No release label; skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${#LABELS[@]}" -gt 1 ]; then
            printf '::error::Expected one release label, found: %s\n' "${LABELS[*]}"
            exit 1
          fi

          LABEL="${LABELS[0]}"
          SYSTEM="${LABEL%%:*}"
          BUMP="${LABEL##*:}"
          TOKENS_PKG="packages/${SYSTEM}-tokens/package.json"
          COMPONENTS_PKG="packages/${SYSTEM}-components/package.json"

          if [ ! -f "$TOKENS_PKG" ] || [ ! -f "$COMPONENTS_PKG" ]; then
            echo "::error::No package pair found for release system '${SYSTEM}'"
            exit 1
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "system=${SYSTEM}" >> "$GITHUB_OUTPUT"
          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v3
        if: steps.label.outputs.skip != 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.label.outputs.skip != 'true'
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        if: steps.label.outputs.skip != 'true'
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        if: steps.label.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        if: steps.label.outputs.skip != 'true'
        id: version
        env:
          SYSTEM: ${{ steps.label.outputs.system }}
          BUMP: ${{ steps.label.outputs.bump }}
        run: |
          TOKENS_PKG="packages/${SYSTEM}-tokens/package.json"
          COMPONENTS_PKG="packages/${SYSTEM}-components/package.json"

          CURRENT=$(jq -r '.version' "$TOKENS_PKG")
          COMPONENTS_CURRENT=$(jq -r '.version' "$COMPONENTS_PKG")

          if [ "$CURRENT" != "$COMPONENTS_CURRENT" ]; then
            echo "::error::Package versions differ before release: tokens=${CURRENT}, components=${COMPONENTS_CURRENT}"
            exit 1
          fi

          if ! [[ "$CURRENT" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::Unsupported package version '${CURRENT}'; expected major.minor.patch"
            exit 1
          fi

          if ! TOKENS_PUBLISHED=$(npm view "@ajustinjames/${SYSTEM}-tokens" version 2>/dev/null); then
            TOKENS_PUBLISHED="0.0.0"
          fi
          if ! COMPONENTS_PUBLISHED=$(npm view "@ajustinjames/${SYSTEM}-components" version 2>/dev/null); then
            COMPONENTS_PUBLISHED="0.0.0"
          fi

          if [ "$TOKENS_PUBLISHED" != "$COMPONENTS_PUBLISHED" ]; then
            echo "::error::Published package versions differ: tokens=${TOKENS_PUBLISHED}, components=${COMPONENTS_PUBLISHED}"
            exit 1
          fi

          if ! [[ "$TOKENS_PUBLISHED" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::Unsupported published package version '${TOKENS_PUBLISHED}'; expected major.minor.patch"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$TOKENS_PUBLISHED"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          EXPECTED="${MAJOR}.${MINOR}.${PATCH}"

          if [ "$CURRENT" != "$EXPECTED" ]; then
            echo "::error::Release label '${SYSTEM}:${BUMP}' expects package version ${EXPECTED}, but package.json has ${CURRENT}. Bump both package manifests in the PR before merging."
            exit 1
          fi

          if git rev-parse "${SYSTEM}-v${CURRENT}" >/dev/null 2>&1; then
            echo "::error::Tag ${SYSTEM}-v${CURRENT} already exists"
            exit 1
          fi

          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Build packages
        if: steps.label.outputs.skip != 'true'
        env:
          SYSTEM: ${{ steps.label.outputs.system }}
        run: |
          pnpm --filter "@ajustinjames/${SYSTEM}-tokens" build
          pnpm --filter "@ajustinjames/${SYSTEM}-components" build

      - name: Publish to npm
        if: steps.label.outputs.skip != 'true'
        env:
          SYSTEM: ${{ steps.label.outputs.system }}
        run: |
          cd "packages/${SYSTEM}-tokens"
          npm publish . --access public

          cd "../${SYSTEM}-components"
          npm publish . --access public

      - name: Push release tag
        if: steps.label.outputs.skip != 'true'
        env:
          SYSTEM: ${{ steps.label.outputs.system }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "${SYSTEM}-v${VERSION}"
          git push origin "refs/tags/${SYSTEM}-v${VERSION}"

      - name: Create GitHub release
        if: steps.label.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYSTEM: ${{ steps.label.outputs.system }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "${SYSTEM}-v${VERSION}" --title "${SYSTEM} v${VERSION}" --generate-notes
